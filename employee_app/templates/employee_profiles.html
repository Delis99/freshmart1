<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/employee_profiles.css">
    <title>Employee Profile Information</title>
    <style>

    </style>
    <script>
        // Confirmation for save and delete actions
        function confirmSave() {
            return confirm("Are you sure you want to save the changes to this profile?");
        }

        function confirmDelete() {
            return confirm("Are you sure you want to delete this profile?");
        }
    </script>
</head>
<body>



    <header>
        <!-- Header -->
    <div class="header">
        <a href="{{ url_for('employee_profiles') }}" style="color: #ff9900; text-decoration: none;">
            <div class="logo" style="font-size: 24px; font-weight: bold;">FreshMart - Employee Profile</div>
        </a>

        <div class="nav">
            <a href="{{ url_for('portal_employee') }}" style="text-decoration: none; display: flex; align-items: center; color: #ff9900;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ff9900" width="24px" height="24px" style="margin-right: 5px;">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span style="color: white;">Portal Employee</span>
            </a>
        </div>
    </div>
    </header>



    <div class="container">
        <h1>Profile Information</h1>

        <!-- Search Bar -->
        <div class="search-bar">
            <form action="{{ url_for('employee_profiles') }}" method="get">
                <input type="text" name="search" placeholder="Search by name..." value="{{ search_term }}">
                <button type="submit">Search</button>
            </form>
        </div>

        <!-- Employee Table -->
        <table>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            {% if employees %}
                {% for employee in employees %}
                    <tr>
                        <!-- Save Form -->
                        <form action="{{ url_for('employee_profiles') }}" method="POST" onsubmit="return confirmSave();" style="display:inline;">
                            <input type="hidden" name="employee_id" value="{{ employee.id }}">
                            <td>{{ employee.id }}</td>
                            <td><input type="text" name="first_name" value="{{ employee.first_name }}" required></td>
                            <td><input type="text" name="last_name" value="{{ employee.last_name }}" required></td>
                            <td><input type="email" name="email" value="{{ employee.email }}" required></td>
                            <td><input type="contact" name="contact" value="{{ employee.contact }}" required></td>
                            <td>
                                <select name="role">
                                    <option value="Admin" {% if employee.role == 'Admin' %}selected{% endif %}>Admin</option>
                                    <option value="Manager" {% if employee.role == 'Manager' %}selected{% endif %}>Manager</option>
                                    <option value="Staff" {% if employee.role == 'Staff' %}selected{% endif %}>Staff</option>
                                    <option value="Supervisor" {% if employee.role == 'Supervisor' %}selected{% endif %}>Supervisor</option>
                                    <option value="Material-Handler" {% if employee.role == 'Material-Handler' %}selected{% endif %}>Material-Handler</option>
                                    <option value="Forklift Operator" {% if employee.role == 'Forklift Operator' %}selected{% endif %}>Forklift Operator</option>
                                    <option value="Inventory Specialist" {% if employee.role == 'Inventory Specialist' %}selected{% endif %}>Inventory Specialist</option>
                                    <option value="Shipping Coordinator" {% if employee.role == 'Shipping Coordinator' %}selected{% endif %}>Shipping Coordinator</option>
                                    <option value="Receiving Clerk" {% if employee.role == 'Receiving Clerk' %}selected{% endif %}>Receiving Clerk</option>
                                    <option value="Order Picker" {% if employee.role == 'Order Picker' %}selected{% endif %}>Order Picker</option>
                                    <option value="Quality Control Inspector" {% if employee.role == 'Quality Control Inspector' %}selected{% endif %}>Quality Control Inspector</option>
                                    <option value="Logistics Coordinator" {% if employee.role == 'Logistics Coordinator' %}selected{% endif %}>Logistics Coordinator</option>
                                    <option value="Maintenance Technician" {% if employee.role == 'Maintenance Technician' %}selected{% endif %}>Maintenance Technician</option>
                                </select>
                            </td>
                            <td class="action-buttons">
                                <button type="submit" class="save-btn">Save</button>
                        </form>

                        <!-- Delete Form -->
                        <form action="{{ url_for('delete_employee', employee_id=employee.id) }}" method="POST" onsubmit="return confirmDelete();" style="display:inline;">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                            </td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="6">No employees found</td>
                </tr>
            {% endif %}
        </table>
    </div>
</body>
</html>
