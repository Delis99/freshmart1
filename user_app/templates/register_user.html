<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="../static/css/register_styles.css">
</head>
<body>
    <!--This part of the code is the fomr of the registration from where user will be able to register.-->
    <div class="container">
        <h1>Register as User</h1>

        <form id="registrationForm" action="/register" method="POST">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" placeholder="John" required> <!--Input - First-Name-->
        
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" placeholder="Doe" required> <!--Input - Last-Name-->
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required> <!--Input - Email-->
        
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="********" required> <!--Input - Password-->
        
            <label for="re_password">Re-enter Password:</label>
            <input type="password" id="re_password" name="re_password" placeholder="********" required> <!--Input - Re-enter Password-->

            <label for="contact">Phone Number:</label>
            <input type="text" id="contact" name="contact" placeholder="564-676-1234" required> <!--Input - Phone Number-->
        
            <button type="submit" class="btn">Register</button> <!--This is the button to submit the form to register-->
        </form>

        <div class="link">
            Already have an account? <a href="/login">Login</a> <!--This part of the code is if the user alredy have an account redirect the user to login-->
        </div>
    </div>

    <script>
        // Format the phone number automatically as the user types
        document.getElementById('contact').addEventListener('input', function (event) {
            let input = event.target.value.replace(/\D/g, ''); // Remove all non-numeric characters
            if (input.length > 10) input = input.slice(0, 10); // Limit to 10 digits
    
            // Format the input as (XXX)-XXX-XXXX
            if (input.length > 6) {
                input = `(${input.slice(0, 3)})-${input.slice(3, 6)}-${input.slice(6)}`;
            } else if (input.length > 3) {
                input = `(${input.slice(0, 3)})-${input.slice(3)}`;
            } else if (input.length > 0) {
                input = `(${input}`;
            }
    
            event.target.value = input; // Set the formatted value back to the input field
        });
    
        // This part of the code Javascript is for validation and display alert if the input require is wrong.
        document.getElementById('registrationForm').addEventListener('submit', async function (event) {
            event.preventDefault();
    
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rePassword = document.getElementById('re_password').value;
            const phoneNumber = document.getElementById('contact').value.replace(/\D/g, ''); // Remove formatting
    
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }
    
            // Check if email already exists 
            const emailCheck = await fetch('/check_email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const emailResponse = await emailCheck.json();
            if (emailResponse.exists) {
                alert('Email already exists. Please use a different email.');
                return;
            }
    
            // Validate phone number format (must be exactly 10 digits)
            if (phoneNumber.length !== 10) {
                alert('Phone number must be exactly 10 digits.');
                return;
            }
    
            // Password validations
            if (password.length < 8) {
                alert('Password must be at least 8 characters long.');
                return;
            }
    
            //Email validation
            const specialCharRegex = /[!@#$%^&*(),.?":{}|<>]/;
            if (!specialCharRegex.test(password)) {
                alert('Password must contain at least one special character.');
                return;
            }
    
            //Password validation
            if (password !== rePassword) {
                alert('Passwords do not match. Please re-enter your passwords.');
                return;
            }
    
            // Submit the form
            alert('Registration successful!');
            this.submit();
        });
    </script>
    
</body>
</html>
