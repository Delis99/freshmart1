<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Registration</title>
    <link rel="stylesheet" href="../static/register_delivery.css">
</head>
<body>
    <div class="container">
        <h1>Register as Delivery Personnel</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alerts">
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/delivery/register" method="POST">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" placeholder="John" required>
        
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
        
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="********" required>
        
            <label for="re_password">Re-enter Password:</label>
            <input type="password" id="re_password" name="re_password" placeholder="********" required>

            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" placeholder="564-676-1234" required>
        
            <button type="submit" class="btn">Register</button>
        </form>

        <div class="link">
            Already have an account? <a href="/delivery/login">Login</a>
        </div>
    </div>
</body>
</html>
